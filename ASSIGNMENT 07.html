<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centred Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff0f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(120, 60, 85, 0.15);
            text-align: center;
        }

        .login-box h1 {
            color: #8b4565;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #654052;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6bfd0;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group input:focus {
            outline: 2px solid #e8a6c0;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: #d979a0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #bd5c84;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }

        .footer a {
            color: #b84e7b;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Welcome Back!</h1>
        <p>Please login to your account</p>

        <form>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                       placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-button">
                Login
            </button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>
    </div>

</body>
</html>
